version: "3.9"

services:
  web:
    build: .
    command: >
      gunicorn config.wsgi:application
      --workers 3
      --bind 0.0.0.0:8667
      --timeout 120
    env_file:
      - .env
    volumes:
      - static:/app/static
      - media:/app/media
    ports:
      - "8667:8667"
    depends_on:
      - db

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data

volumes:
  postgres:
  static:
  media:
